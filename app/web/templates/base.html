<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AutoHDR Photo to Video{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body>
  {% set path = request.url.path %}
  <nav class="nav">
    <a class="brand" href="/">Photo to Video</a>
    <a href="/" class="{{ 'on' if path == '/' }}">Styles</a>
    <a href="/new" class="{{ 'on' if path == '/new' }}">New video</a>
    <a href="/jobs" class="{{ 'on' if path.startswith('/jobs') }}">Jobs</a>
    <a href="/styles/new" class="{{ 'on' if path.startswith('/styles/') }}">Create a style</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
