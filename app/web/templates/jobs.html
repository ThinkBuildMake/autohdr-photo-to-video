{% extends "base.html" %}
{% block title %}Jobs{% endblock %}
{% block content %}
<h1>Jobs</h1>
<table>
  <thead><tr><th>Style</th><th>Photoshoot</th><th>Status</th><th>Submitted</th></tr></thead>
  <tbody>
    {% for job in jobs %}
    <tr>
      <td><a href="/jobs/{{ job.id }}">{{ job.style_name }}</a></td>
      <td>{{ job.photoshoot_label or "" }}</td>
      <td>{{ job.status }}</td>
      <td>{{ job.submitted_at or "" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
